
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый тестовый сайт</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #007bff;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
.site-image {
    max-width: 100%;    /* Картинка не будет сжиматься и выходить за рамки сайта */
    height: auto;       /* Пропорции фотографии сохранятся */
    display: block;     /* Размещаем картинку на отдельной строке */
    margin: 20px auto;  /* Делаем отступы сверху/снизу и центрируем её */
    border-radius: 8px; /* Слегка скруглим углы картинки для красоты */
}
    </style>
</head>
<body>

    <div class="container">
        <h1>Привет! Это мой тестовый сайт 🎉</h1>
        <p>Если ты видишь эту страницу, значит, всё работает правильно.</p>
   <img src="pic.png" alt="Моя тестовая картинка" class="site-image">
<iframe width="100%" height="250" src="https://www.youtube.com/embed/ByH9LuSILxU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 8px; max-width: 460px;"></iframe>
<a href="about.html" style="display: inline-block; margin: 15px; color: #007bff;">Перейти на страницу "Обо мне"</a>
        <button onclick="alert('Ура, кнопка работает!')">Нажми на меня</button>
    </div>

</body>
</html>
