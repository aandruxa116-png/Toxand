    <script>
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        // Авто-определение темы по часам (Включает темную с 18:00 вечера до 6:00 утра)
        function autoTheme() {
            const currentHour = new Date().getHours();
            if (currentHour >= 18 || currentHour < 6) {
                body.classList.add('dark-mode');
                themeToggle.innerHTML = '☀️ Светлая тема';
            } else {
                body.classList.remove('dark-mode');
                themeToggle.innerHTML = '🌙 Темная тема';
            }
        }

        // Запуск проверки времени при загрузке
        autoTheme();

        // Ручное переключение кнопкой
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                themeToggle.innerHTML = '☀️ Светлая тема';
            } else {
                themeToggle.innerHTML = '🌙 Темная тема';
            }
        });
    </script>
