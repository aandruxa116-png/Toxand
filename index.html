
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый тестовый сайт</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Красивый плавный градиент на фон вместо скучного серого цвета: */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.95); /* Полупрозрачный белый фон */
            padding: 30px;
            border-radius: 15px;
            /* Делаем тень более мягкой и объемной: */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: inline-block;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #4a5568;
            margin-bottom: 20px;
        }
        img {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* Стильная кнопка вместо стандартной синей ссылки */
        .nav-button {
            display: inline-block;
            margin: 15px 0;
            padding: 10px 20px;
            background-color: #ff758f;
            color: white !important;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(255, 117, 143, 0.3);
        }
        .nav-button:hover {
            background-color: #ff4f73;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 117, 143, 0.5);
        }
.site-image {
    max-width: 100%;    /* Картинка не будет сжиматься и выходить за рамки сайта */
    height: auto;       /* Пропорции фотографии сохранятся */
    display: block;     /* Размещаем картинку на отдельной строке */
    margin: 20px auto;  /* Делаем отступы сверху/снизу и центрируем её */
    border-radius: 8px; /* Слегка скруглим углы картинки для красоты */
}
    </style>
</head>
<body>

    <div class="container">
        <h1>Привет! Это мой тестовый сайт 🎉</h1>
        <p>Если ты видишь эту страницу, значит, всё работает правильно.</p>
   <img src="pic.png" alt="Моя тестовая картинка" class="site-image">
<iframe width="100%" height="250" src="https://www.youtube.com/embed/ByH9LuSILxU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 8px; max-width: 460px;"></iframe>
<a href="about.html" class="nav-button">Перейти на страницу "Обо мне"</a>
        <button onclick="alert('Ура, кнопка работает!')">Нажми на меня</button>
    </div>

</body>
</html>
